name: Import public AReUReDi method figure
on:
  push:
    branches: [areuredi-method-import]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and validate the public arXiv Figure 1
        run: |
          curl --fail --location --max-time 45 --retry 1 'https://arxiv.org/html/2510.00352v2/AReUReDi.png' -o /tmp/areuredi-method.png
          python3 - <<'PY'
          import struct, pathlib
          p = pathlib.Path('/tmp/areuredi-method.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n' and data[12:16] == b'IHDR', 'Not PNG'
          w,h = struct.unpack('>II', data[16:24])
          assert w >= 500 and h >= 400 and abs(w/h - 1532/1342) < .04, (w,h)
          assert len(data) < 10000000
          print('Figure dimensions:', w,h)
          pathlib.Path('images/publications/areuredi-method.png').write_bytes(data)
          PY
      - name: Save the image on the import branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/publications/areuredi-method.png
          git commit -m "Import the public AReUReDi method figure"
          git push origin HEAD:areuredi-method-import
