name: Check Jekyll site
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Check generated pages, publications and search index
        run: |
          ruby -rjson -e '
            paths = %w[index.html publications/index.html cv/index.html notes/index.html notes/physics/quantum-mechanics-of-molecules/index.html notes/search.json]
            paths.each { |p| abort("Missing output: #{p}") unless File.file?(File.join("_site",p)) }
            publications = File.read("_site/publications/index.html")
            abort("Missing nine publication entries") unless publications.scan(/class="publication-entry"/).size == 9
            %w[pCoMole PeptiVerse PIGEON moPPIt AReUReDi LaPep PTM-Mamba].each { |name| abort("Missing publication: #{name}") unless publications.include?(name) }
            abort("Missing MOG-DFM") unless publications.include?("Multi-Objective-Guided Discrete Flow Matching")
            abort("Missing research highlight") unless publications.include?("Synergizing Sequence and Structure Representations")
            abort("Missing direct paper links") unless publications.scan(/>Paper<\/a>/).size == 9
            figure_paths = %w[pcomole-method.svg peptiverse-method.svg pigeon.webp moppit-method.svg areuredi-method.png lapep-method.svg mog-dfm.webp ptm-mamba-method.svg promep.webp]
            abort("Missing method figure thumbnails") unless publications.scan(/class="publication-entry__figure"/).size == figure_paths.size
            figure_paths.each do |name|
              image = "images/publications/#{name}"
              path = File.join("_site",image)
              abort("Missing publication method figure: #{image}") unless File.file?(path)
              valid = case File.extname(name)
              when ".svg" then File.read(path).start_with?("<svg")
              when ".png" then File.binread(path,8) == "\x89PNG\r\n\x1a\n".b
              when ".webp" then File.binread(path,12)[8,4] == "WEBP"
              else false
              end
              abort("Invalid publication method figure: #{image}") unless valid
              abort("Missing rendered method figure link: #{image}") unless publications.include?(image)
            end
            abort("Unexpected results figure") if publications.include?("images/publications/areuredi.webp")
            abort("Unexpected publication intro or figure caption") if publications.include?("selected publications and workshop papers") || publications.include?("<figcaption")
            homepage = File.read("_site/index.html")
            abort("Missing updated advisor links") unless homepage.include?("https://dequan.wang/") && homepage.include?("https://sjtu-deng-lab.github.io/")
            abort("Outdated homepage news") if homepage.include?("Started my Ph.D.") || homepage.include?("Graduated from Fudan University") || homepage.include?("listed in the ICLR")
            notes = JSON.parse(File.read("_site/notes/search.json"))
            new_note = notes.find { |n| n["title"] == "What Is a Molecule, Quantum Mechanically?" }
            abort("Missing new note or full-text index") unless new_note && new_note["content"].include?("one-particle reduced density matrix") && new_note["content"].include?("Hohenberg")
            abort("Old note still indexed") if notes.any? { |n| n["title"] == "Electron Density and Electric Fields" }
            note_html = File.read("_site/notes/physics/quantum-mechanics-of-molecules/index.html")
            article = note_html[/<article class="note-content"[^>]*>(.*?)<\/article>/m, 1]
            abort("Missing note article") unless article
            abort("Missing sections or references") unless article.scan(/<h2\b/).size == 10 && article.include?("Hohenberg")
            notes.each { |n| abort("Broken note URL: #{n["url"]}") unless File.file?(File.join("_site", n["url"].sub(%r{^/}, ""), "index.html")) }
          '
          python3 .github/scripts/prepare_note.py .github/note_sources/physics/quantum-mechanics-of-molecules.md _notes/physics/quantum-mechanics-of-molecules.md --check --rendered _site/notes/physics/quantum-mechanics-of-molecules/index.html --tables 1 --rows 7 --headings 10
          node --check assets/js/notes.js
          node --check assets/js/mathjax-config.js
